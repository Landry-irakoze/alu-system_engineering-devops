<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f172a, #1e3a8a, #7c3aed);
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  color: #fff;
  text-align: center;
}
.box { padding: 2rem; max-width: 560px; }
h1 {
  font-size: clamp(6rem, 25vw, 11rem);
  line-height: 1;
  letter-spacing: .05em;
  background: linear-gradient(90deg, #38bdf8, #f472b6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: float 3s ease-in-out infinite;
}
h2 { font-size: 1.6rem; margin: 1rem 0 .5rem; font-style: italic; }
p { opacity: .85; margin-bottom: 2rem; line-height: 1.6; }
a {
  display: inline-block;
  padding: .85rem 2rem;
  border-radius: 999px;
  background: #fff;
  color: #1e3a8a;
  font-weight: 600;
  text-decoration: none;
  transition: transform .2s, box-shadow .2s;
}
a:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,.35); }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}
</style>
</head>
<body>
<div class="box">
<h1>404</h1>
<h2>Ceci n'est pas une page</h2>
<p>The page you are looking for has wandered off. Let's get you back on track.</p>
<a href="/">Back to home</a>
</div>
</body>
</html>
